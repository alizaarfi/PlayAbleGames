# Micronaut server settings
micronaut.application.name=playablegames
micronaut.server.port=8081
micronaut.server.cors.enabled=true
micronaut.security.enabled=true

# cors configurations - to allow react server for dev
# when finished dev should serve the react files from micronaut
#micronaut.server.cors.configurations.web.allowedOrigins[0]=http://localhost:5173
#micronaut.server.cors.configurations.web.allowedOrigins[0]=http://localhost:5175
#micronaut.server.cors.configurations.web.allowedMethods[0]=GET
#micronaut.server.cors.configurations.web.allowedMethods[1]=POST
#micronaut.server.cors.configurations.web.allowedMethods[2]=PUT
#micronaut.server.cors.configurations.web.allowedMethods[3]=DELETE
#micronaut.server.cors.configurations.web.allowedHeaders[0]=Content-Type
#micronaut.server.cors.configurations.web.allowedHeaders[1]=Authorization

# Default configuration (for login/signup)
micronaut.server.cors.configurations.default.allowedOrigins[0]=http://localhost:5175
micronaut.server.cors.configurations.default.allowedOrigins[1]=http://localhost:5173
micronaut.server.cors.configurations.default.allowedOrigins[2]=http://localhost:5174
micronaut.server.cors.configurations.default.allowedOrigins[3]=http://localhost:3000
micronaut.server.cors.configurations.default.allowedMethods=GET,POST,PUT,DELETE,OPTIONS
micronaut.server.cors.configurations.default.allowedHeaders=Content-Type,Authorization
micronaut.server.cors.configurations.default.allowCredentials=true
micronaut.server.cors.configurations.default.maxAge=3600

# Database configuration
datasources.default.db-type=mariadb
datasources.default.driver-class-name=org.mariadb.jdbc.Driver
datasources.default.url=jdbc:mariadb://localhost:3306/AppDB
datasources.default.username=root
datasources.default.password=comsc

vosk.model.path=${VOSK_MODEL_PATH:model}
vosk.log.level=INFO

# Vosk configuration
vosk:
model:
path: ${VOSK_MODEL_PATH:/models/vosk-model-small-en-us-0.15}
sample-rate: 16000

# Web configuration (for authenticated endpoints)
micronaut.server.cors.configurations.web.allowedOrigins[0]=http://localhost:5175
micronaut.server.cors.configurations.web.allowedOrigins[1]=http://localhost:5173
micronaut.server.cors.configurations.web.allowedOrigins[2]=http://localhost:5174
micronaut.server.cors.configurations.web.allowedOrigins[3]=http://localhost:3000
micronaut.server.cors.configurations.web.allowedMethods=GET,POST,PUT,DELETE,OPTIONS
micronaut.server.cors.configurations.web.allowedHeaders=Content-Type,Authorization
micronaut.server.cors.configurations.web.exposedHeaders=Authorization
micronaut.server.cors.configurations.web.allowCredentials=true
micronaut.server.cors.configurations.web.maxAge=3600
# Authentication
micronaut.security.authentication=bearer

# JWT secret
micronaut.security.token.jwt.signatures.secret.generator.secret=mySuperSecretKey123456789_myApp_2025

# Security intercept rules
micronaut.security.intercept-url-map[0].pattern=/user/register
micronaut.security.intercept-url-map[0].access=isAnonymous()

micronaut.security.intercept-url-map[1].pattern=/user/login
micronaut.security.intercept-url-map[1].access=isAnonymous()

# Allow voice control for everyone (authenticated or not) 
micronaut.security.intercept-url-map[2].pattern=/api/v1/transcription/**
micronaut.security.intercept-url-map[2].access=isAnonymous()

# Allow all OPTIONS (CORS preflight)
micronaut.security.intercept-url-map[3].pattern=/**
micronaut.security.intercept-url-map[3].http-method=OPTIONS
micronaut.security.intercept-url-map[3].access=isAnonymous()

#allow profile update for authenticated users
micronaut.security.intercept-url-map[4].pattern=/api/user/profile
micronaut.security.intercept-url-map[4].http-method=PUT
micronaut.security.intercept-url-map[4].access=isAuthenticated()

#allow profile retrival for authenticated user
micronaut.security.intercept-url-map[5].pattern=/api/user/profile
micronaut.security.intercept-url-map[5].http-method=GET
micronaut.security.intercept-url-map[5].access=isAuthenticated()

#allow account deletion for authenticated users
micronaut.security.intercept-url-map[6].pattern=/api/user/delete-account
micronaut.security.intercept-url-map[6].http-method=DELETE
micronaut.security.intercept-url-map[6].access=isAuthenticated()

# Protected routes
micronaut.security.intercept-url-map[7].pattern=/**
micronaut.security.intercept-url-map[7].access=isAuthenticated()