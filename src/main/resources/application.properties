# Micronaut server settings
micronaut.application.name=playablegames
micronaut.server.port=8081
micronaut.server.cors.enabled=true
micronaut.security.enabled=true  

# cors configurations - to allow react server for dev
# when finished dev should serve the react files from micronaut
micronaut.server.cors.configurations.web.allowedOrigins[0]=http://localhost:5173
micronaut.server.cors.configurations.web.allowedMethods[0]=GET
micronaut.server.cors.configurations.web.allowedMethods[1]=POST
micronaut.server.cors.configurations.web.allowedMethods[2]=PUT
micronaut.server.cors.configurations.web.allowedMethods[3]=DELETE
micronaut.server.cors.configurations.web.allowedHeaders[0]=Content-Type
micronaut.server.cors.configurations.web.allowedHeaders[1]=Authorization


# Database configuration
datasources.default.db-type=mariadb
datasources.default.driver-class-name=org.mariadb.jdbc.Driver

datasources.default.url=jdbc:mariadb://localhost:3306/AppDB
datasources.default.username=root
datasources.default.password=comsc

vosk.model.path=${VOSK_MODEL_PATH:model}
vosk.log.level=INFO

# Vosk configuration
vosk:
model:
path: ${VOSK_MODEL_PATH:/models/vosk-model-small-en-us-0.15}
sample-rate: 16000


# Authentication
micronaut.security.authentication=bearer

# JWT secret
micronaut.security.token.jwt.signatures.secret.generator.secret=mySuperSecretKey123456789_myApp_2025
# Security intercept rules - ORDER MATTERS! Public endpoints FIRST, catch-all LAST
micronaut.security.intercept-url-map[0].pattern=/user/register
micronaut.security.intercept-url-map[0].httpMethod=POST
micronaut.security.intercept-url-map[0].access=isAnonymous()

micronaut.security.intercept-url-map[1].pattern=/user/login
micronaut.security.intercept-url-map[1].httpMethod=POST
micronaut.security.intercept-url-map[1].access=isAnonymous()

micronaut.security.intercept-url-map[2].pattern=/api/v1/transcription/**
micronaut.security.intercept-url-map[2].access=isAnonymous()

micronaut.security.intercept-url-map[3].pattern=/api/discussions
micronaut.security.intercept-url-map[3].httpMethod=GET
micronaut.security.intercept-url-map[3].access=isAnonymous()

micronaut.security.intercept-url-map[4].pattern=/api/discussions/*
micronaut.security.intercept-url-map[4].httpMethod=GET
micronaut.security.intercept-url-map[4].access=isAnonymous()

micronaut.security.intercept-url-map[5].pattern=/api/discussions/*/replies
micronaut.security.intercept-url-map[5].httpMethod=GET
micronaut.security.intercept-url-map[5].access=isAnonymous()

micronaut.security.intercept-url-map[6].pattern=/api/blogs
micronaut.security.intercept-url-map[6].httpMethod=GET
micronaut.security.intercept-url-map[6].access=isAnonymous()

micronaut.security.intercept-url-map[7].pattern=/api/faq
micronaut.security.intercept-url-map[7].httpMethod=GET
micronaut.security.intercept-url-map[7].access=isAnonymous()

micronaut.security.intercept-url-map[8].pattern=/api/games
micronaut.security.intercept-url-map[8].httpMethod=GET
micronaut.security.intercept-url-map[8].access=isAnonymous()

micronaut.security.intercept-url-map[9].pattern=/api/games/*
micronaut.security.intercept-url-map[9].httpMethod=GET
micronaut.security.intercept-url-map[9].access=isAnonymous()

# Catch-all MUST BE LAST
micronaut.security.intercept-url-map[10].pattern=/**
micronaut.security.intercept-url-map[10].access=isAuthenticated()



## Catch-all rule MUST BE LAST - requires authentication for everything else
