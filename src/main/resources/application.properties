# Micronaut server settings
micronaut.application.name=playablegames
micronaut.server.port=8081
micronaut.server.cors.enabled=true
micronaut.security.enabled=true

# Database configuration
datasources.default.db-type=mariadb
datasources.default.driver-class-name=org.mariadb.jdbc.Driver

datasources.default.url=jdbc:mariadb://localhost:3306/AppDB
datasources.default.username=root
datasources.default.password=comsc

vosk.model.path=${VOSK_MODEL_PATH:model}
vosk.log.level=INFO

# Vosk configuration
vosk:
model:
path: ${VOSK_MODEL_PATH:/models/vosk-model-small-en-us-0.15}
sample-rate: 16000

# CORS Configuration - ADD THESE LINES
micronaut.server.cors.configurations.web.allowed-origins[0]=http://localhost:5173
micronaut.server.cors.configurations.web.allowed-origins[1]=http://localhost:5174
micronaut.server.cors.configurations.web.allowed-origins[2]=http://localhost:3000
micronaut.server.cors.configurations.web.allowed-methods[0]=GET
micronaut.server.cors.configurations.web.allowed-methods[1]=POST
micronaut.server.cors.configurations.web.allowed-methods[2]=PUT
micronaut.server.cors.configurations.web.allowed-methods[3]=DELETE
micronaut.server.cors.configurations.web.allowed-methods[4]=OPTIONS
micronaut.server.cors.configurations.web.allowed-headers[0]=Content-Type
micronaut.server.cors.configurations.web.allowed-headers[1]=Authorization
micronaut.server.cors.configurations.web.exposed-headers[0]=Authorization
micronaut.server.cors.configurations.web.allow-credentials=true
micronaut.server.cors.configurations.web.max-age=3600

# Authentication
micronaut.security.authentication=bearer

# JWT secret
micronaut.security.token.jwt.signatures.secret.generator.secret=mySuperSecretKey123456789_myApp_2025

# Security intercept rules - ADD THESE LINES
micronaut.security.intercept-url-map[0].pattern=/user/register
micronaut.security.intercept-url-map[0].access=isAnonymous()
micronaut.security.intercept-url-map[1].pattern=/user/login
micronaut.security.intercept-url-map[1].access=isAnonymous()
micronaut.security.intercept-url-map[2].pattern=/**
micronaut.security.intercept-url-map[2].access=isAuthenticated()